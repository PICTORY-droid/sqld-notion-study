<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQLD 영어단어 퀴즈</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f8f9fa;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.quiz-wrap {
  width: 100%;
  max-width: 680px;
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 16px;
  overflow: hidden;
}
.quiz-header {
  padding: 14px 20px;
  border-bottom: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stage-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: #e6f1fb;
  color: #1a5fa8;
}
.quiz-count {
  font-size: 12px;
  color: #888;
}
.quiz-body {
  padding: 24px 20px 16px;
  min-height: 200px;
}
.quiz-label {
  font-size: 11px;
  color: #aaa;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.word-display {
  font-size: 26px;
  font-weight: 700;
  color: #1a5fa8;
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}
.quiz-question {
  font-size: 15px;
  color: #444;
  line-height: 1.7;
  min-height: 40px;
  font-weight: 400;
}
.cursor {
  display: inline-block;
  width: 2px;
  height: 16px;
  background: #1a1a1a;
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 0.7s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.options {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  color: #333;
  line-height: 1.5;
  transition: background 0.15s;
  text-align: left;
  background: #fff;
  width: 100%;
}
.option:hover { background: #f0f6ff; }
.option.correct { background: #eaf3de; border-color: #639922; color: #3b6d11; }
.option.wrong { background: #fce8e8; border-color: #e24b4a; color: #a32d2d; }
.option-num {
  font-weight: 600;
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 1px;
}
.answer-box {
  display: none;
  margin-top: 16px;
  padding: 12px 16px;
  background: #f0f6ff;
  border-left: 3px solid #1a5fa8;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: #1a5fa8;
  line-height: 1.6;
}
.quiz-footer {
  padding: 12px 20px;
  border-top: 1px solid #e5e5e5;
  display: flex;
  gap: 8px;
}
.btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid #e5e5e5;
  background: #fff;
  color: #333;
  transition: background 0.15s;
}
.btn:hover { background: #f5f5f5; }
.btn-answer {
  background: #f0f6ff;
  color: #1a5fa8;
  border-color: #c8dff8;
}
.btn-answer:hover { background: #ddeeff; }
.btn-next {
  background: #1a1a1a;
  color: #fff;
  border-color: #1a1a1a;
}
.btn-next:hover { background: #333; }
.btn-pass {
  background: #fff8e6;
  color: #b45309;
  border-color: #fde68a;
}
.btn-pass:hover { background: #fef3c7; }
.progress-bar {
  height: 3px;
  background: #f0f0f0;
}
.progress-fill {
  height: 100%;
  background: #1a5fa8;
  transition: width 0.4s ease;
}
.result-box {
  padding: 40px 20px;
  text-align: center;
}
.result-emoji { font-size: 48px; margin-bottom: 12px; }
.result-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
.result-sub { font-size: 14px; color: #888; margin-bottom: 24px; }
.result-stats {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 24px;
}
.stat-card {
  background: #f8f9fa;
  border-radius: 12px;
  padding: 14px 20px;
  text-align: center;
}
.stat-num { font-size: 24px; font-weight: 700; color: #1a1a1a; }
.stat-label { font-size: 12px; color: #888; margin-top: 2px; }
.btn-restart {
  padding: 12px 32px;
  background: #1a5fa8;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.btn-restart:hover { background: #154d8a; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div id="main"></div>
</div>

<script>
const WORDS = [
  {word:"Attribute", desc:"속성", ex:"엔터티가 가지는 세부 데이터 항목 (예: 이름, 나이)"},
  {word:"Aggregate Function", desc:"집계 함수", ex:"여러 행을 하나의 결과로 반환 (SUM, AVG, COUNT 등)"},
  {word:"Association", desc:"연관 / 관계", ex:"두 엔터티 간의 관계를 나타냄"},
  {word:"Business Rule", desc:"업무 규칙", ex:"데이터 모델링의 기반이 되는 업무 요건"},
  {word:"Cardinality", desc:"카디널리티 / 집합의 원소 수", ex:"1:1, 1:N, M:N 관계를 나타냄"},
  {word:"Column", desc:"열 / 컬럼", ex:"테이블에서 세로 방향의 데이터 항목"},
  {word:"Constraint", desc:"제약조건", ex:"PK, FK, UNIQUE, NOT NULL 등 데이터 무결성 규칙"},
  {word:"CRUD", desc:"생성·조회·수정·삭제", ex:"Create, Read, Update, Delete의 약자"},
  {word:"Composite Key", desc:"복합키", ex:"두 개 이상의 컬럼으로 이루어진 기본키"},
  {word:"Cascading", desc:"연쇄 처리", ex:"부모 행 삭제 시 자식 행도 함께 삭제되는 옵션"},
  {word:"Data Model", desc:"데이터 모델", ex:"현실 세계 데이터를 추상화해 표현한 구조"},
  {word:"DDL", desc:"데이터 정의어", ex:"CREATE, ALTER, DROP 등 구조를 정의하는 SQL"},
  {word:"DML", desc:"데이터 조작어", ex:"SELECT, INSERT, UPDATE, DELETE"},
  {word:"DCL", desc:"데이터 제어어", ex:"GRANT, REVOKE — 권한 관리 SQL"},
  {word:"Domain", desc:"도메인", ex:"속성이 가질 수 있는 값의 범위 (예: 나이는 0~150)"},
  {word:"Derived Attribute", desc:"파생 속성", ex:"다른 속성으로부터 계산되는 속성 (예: 나이 → 생년월일)"},
  {word:"Entity", desc:"엔터티", ex:"독립적으로 존재하는 사람, 사물, 개념의 집합"},
  {word:"ERD", desc:"개체-관계 다이어그램", ex:"Entity Relationship Diagram — 데이터 구조 시각화"},
  {word:"Equi Join", desc:"등가 조인", ex:"= 연산자를 사용하는 조인"},
  {word:"Existence Dependency", desc:"존재 종속", ex:"부모 엔터티가 없으면 자식 엔터티도 존재 불가"},
  {word:"Foreign Key", desc:"외래키", ex:"다른 테이블의 기본키를 참조하는 컬럼"},
  {word:"Full Outer Join", desc:"완전 외부 조인", ex:"양쪽 테이블의 모든 행을 반환"},
  {word:"Functional Dependency", desc:"함수적 종속", ex:"X → Y: X값이 결정되면 Y값도 결정됨"},
  {word:"GROUP BY", desc:"그룹화", ex:"특정 컬럼 기준으로 행을 묶어 집계"},
  {word:"HAVING", desc:"그룹 조건 필터", ex:"GROUP BY 이후 조건 적용 (WHERE는 그룹화 전)"},
  {word:"Hierarchy", desc:"계층 구조", ex:"상위-하위 관계로 구성된 데이터 구조"},
  {word:"Index", desc:"인덱스", ex:"검색 속도 향상을 위한 별도 자료구조"},
  {word:"Instance", desc:"인스턴스", ex:"엔터티의 실제 데이터 한 건 (= 행, 튜플)"},
  {word:"Integrity", desc:"무결성", ex:"데이터가 정확하고 일관된 상태를 유지하는 성질"},
  {word:"Inner Join", desc:"내부 조인", ex:"두 테이블에서 조인 조건을 만족하는 행만 반환"},
  {word:"Join", desc:"조인", ex:"두 개 이상의 테이블을 연결해 데이터를 조회"},
  {word:"Key", desc:"키", ex:"행을 고유하게 식별하는 컬럼 (PK, FK, UK 등)"},
  {word:"Lookup Table", desc:"참조 테이블", ex:"코드값의 의미를 저장하는 보조 테이블"},
  {word:"Many-to-Many", desc:"다대다 관계 (M:N)", ex:"학생-수업처럼 양쪽이 여러 개와 연결"},
  {word:"Metadata", desc:"메타데이터", ex:"데이터에 대한 데이터 (컬럼명, 타입, 길이 등)"},
  {word:"Normalization", desc:"정규화", ex:"중복을 제거하고 데이터 일관성을 높이는 과정"},
  {word:"NULL", desc:"널 / 값 없음", ex:"아직 알 수 없거나 해당 없는 값 (0이나 공백과 다름)"},
  {word:"Non-key Attribute", desc:"비키 속성", ex:"기본키가 아닌 일반 속성"},
  {word:"One-to-Many", desc:"일대다 관계 (1:N)", ex:"부서(1) — 직원(N) 관계"},
  {word:"One-to-One", desc:"일대일 관계 (1:1)", ex:"주민(1) — 여권(1) 관계"},
  {word:"Outer Join", desc:"외부 조인", ex:"조인 조건 불만족 행도 포함해 반환"},
  {word:"Primary Key", desc:"기본키 (PK)", ex:"테이블에서 행을 유일하게 식별하는 컬럼"},
  {word:"Projection", desc:"프로젝션", ex:"필요한 컬럼만 선택해 조회 (SELECT절)"},
  {word:"Partial Dependency", desc:"부분 함수 종속", ex:"복합키 중 일부에만 종속 → 2NF 위반"},
  {word:"Query", desc:"쿼리", ex:"데이터를 조회하거나 조작하는 SQL 명령문"},
  {word:"Relationship", desc:"관계", ex:"두 엔터티 간의 연관성 (1:1, 1:N, M:N)"},
  {word:"Redundancy", desc:"중복", ex:"같은 데이터가 여러 곳에 저장돼 이상 현상 유발"},
  {word:"Rollback", desc:"롤백", ex:"트랜잭션 이전 상태로 되돌리는 작업"},
  {word:"Row", desc:"행 / 튜플", ex:"테이블에서 가로 방향의 데이터 한 건"},
  {word:"Schema", desc:"스키마", ex:"데이터베이스의 전체 구조 정의"},
  {word:"Subquery", desc:"서브쿼리", ex:"쿼리 안에 포함된 또 다른 쿼리"},
  {word:"Self Join", desc:"셀프 조인", ex:"같은 테이블을 두 번 조인 (계층 구조 조회 등)"},
  {word:"Table", desc:"테이블", ex:"행과 열로 구성된 관계형 데이터 저장 구조"},
  {word:"Transaction", desc:"트랜잭션", ex:"ACID를 보장하는 논리적 작업 단위"},
  {word:"Tuple", desc:"튜플 / 행", ex:"테이블에서 하나의 데이터 레코드"},
  {word:"Transitive Dependency", desc:"이행 함수 종속", ex:"A→B→C: A가 C를 간접 결정 → 3NF 위반"},
  {word:"UNION", desc:"합집합 (중복 제거)", ex:"두 쿼리 결과를 합치고 중복 제거"},
  {word:"UNION ALL", desc:"합집합 (중복 포함)", ex:"두 쿼리 결과를 합치고 중복 유지"},
  {word:"Unique Key", desc:"유일키 (UK)", ex:"NULL은 허용하지만 중복 불가한 키"},
  {word:"Update Anomaly", desc:"갱신 이상", ex:"중복 데이터 일부만 수정 시 불일치 발생"},
  {word:"View", desc:"뷰", ex:"SELECT 결과를 저장한 가상 테이블"},
  {word:"WHERE", desc:"조건절", ex:"행을 필터링하는 SQL 조건 (그룹화 전 적용)"},
  {word:"Workload", desc:"작업 부하", ex:"시스템이 처리하는 데이터 요청의 양"},
];

// 보기 생성: 정답 포함 4개 랜덤
function makeOptions(correct, all) {
  const wrong = all.filter(w => w.desc !== correct.desc);
  const picks = [];
  while (picks.length < 3) {
    const r = wrong[Math.floor(Math.random() * wrong.length)];
    if (!picks.find(p => p.desc === r.desc)) picks.push(r);
  }
  const opts = [...picks.map(w => w.desc), correct.desc];
  // 섞기
  for (let i = opts.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [opts[i], opts[j]] = [opts[j], opts[i]];
  }
  return { opts, ans: opts.indexOf(correct.desc) };
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const shuffled = shuffle(WORDS);
const total = shuffled.length;
let idx = 0, correct = 0, answered = 0, selected = false;

function render() {
  if (idx >= total) { showResult(); return; }
  const w = shuffled[idx];
  const { opts, ans } = makeOptions(w, WORDS);
  const pct = Math.round((idx / total) * 100);
  document.getElementById('progress').style.width = pct + '%';

  document.getElementById('main').innerHTML = `
    <div class="quiz-header">
      <span class="stage-badge">🔤 영어단어</span>
      <span class="quiz-count">${idx + 1} / ${total}</span>
    </div>
    <div class="quiz-body">
      <div class="quiz-label">이 단어의 뜻은?</div>
      <div class="word-display">${w.word}</div>
      <div class="quiz-question" id="qtext"></div>
      <div class="options" id="opts" style="opacity:0;transition:opacity 0.3s;"></div>
      <div class="answer-box" id="answerBox"></div>
    </div>
    <div class="quiz-footer">
      <button class="btn btn-answer" onclick="showAnswer(${ans},'${w.ex.replace(/'/g,"\\'")}')">💡 정답 보기</button>
      <button class="btn btn-pass" onclick="passQ()">⏭ 패스</button>
      <button class="btn btn-next" id="nextBtn" onclick="nextQ()" style="display:none">다음 단어 →</button>
    </div>
  `;

  // 설명 타이핑
  typeText(w.ex, 'qtext', () => {
    const optsEl = document.getElementById('opts');
    optsEl.style.opacity = '1';
    opts.forEach((o, i) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.innerHTML = `<span class="option-num">${['①','②','③','④'][i]}</span>${o}`;
      btn.onclick = () => selectOpt(i, ans, w.ex);
      optsEl.appendChild(btn);
    });
  });
  selected = false;
}

function typeText(text, id, cb) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  let i = 0;
  const speed = Math.max(20, Math.min(40, 1200 / text.length));
  const timer = setInterval(() => {
    if (i < text.length) {
      el.insertBefore(document.createTextNode(text[i]), cursor);
      i++;
    } else {
      clearInterval(timer);
      cursor.remove();
      if (cb) cb();
    }
  }, speed);
}

function selectOpt(i, ans, ex) {
  if (selected) return;
  selected = true;
  answered++;
  const opts = document.querySelectorAll('.option');
  opts.forEach((btn, j) => {
    if (j === ans) btn.classList.add('correct');
    else if (j === i) btn.classList.add('wrong');
    btn.onclick = null;
  });
  if (i === ans) correct++;
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('answerBox').textContent = '💡 ' + ex;
  document.getElementById('nextBtn').style.display = 'flex';
}

function showAnswer(ans, ex) {
  if (selected) return;
  selected = true;
  answered++;
  const opts = document.querySelectorAll('.option');
  opts.forEach((btn, j) => {
    if (j === ans) btn.classList.add('correct');
    btn.onclick = null;
  });
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('answerBox').textContent = '💡 ' + ex;
  document.getElementById('nextBtn').style.display = 'flex';
}

function passQ() { idx++; render(); }
function nextQ() { idx++; render(); }

function showResult() {
  document.getElementById('progress').style.width = '100%';
  const rate = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  let emoji, msg;
  if (rate >= 80) { emoji = '🏆'; msg = '영어단어 완벽 마스터!'; }
  else if (rate >= 60) { emoji = '👍'; msg = '잘하고 있어요! 조금 더!'; }
  else { emoji = '📚'; msg = '틀린 단어 다시 복습해봐요!'; }

  document.getElementById('main').innerHTML = `
    <div class="result-box">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-sub">SQLD 영어단어 ${total}개 완료!</div>
      <div class="result-stats">
        <div class="stat-card"><div class="stat-num">${correct}</div><div class="stat-label">정답</div></div>
        <div class="stat-card"><div class="stat-num">${answered - correct}</div><div class="stat-label">오답</div></div>
        <div class="stat-card"><div class="stat-num">${total - answered}</div><div class="stat-label">패스</div></div>
        <div class="stat-card"><div class="stat-num">${rate}%</div><div class="stat-label">정답률</div></div>
      </div>
      <button class="btn-restart" onclick="location.reload()">다시 풀기 🔄</button>
    </div>
  `;
}

render();
</script>
</body>
</html>
