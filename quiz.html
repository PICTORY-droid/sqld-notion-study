<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f8f9fa;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}
.quiz-wrap {
  width: 100%;
  max-width: 680px;
  background: #fff;
  border: 1px solid #e5e5e5;
  border-radius: 16px;
  overflow: hidden;
}
.quiz-header {
  padding: 14px 20px;
  border-bottom: 1px solid #e5e5e5;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stage-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  background: #eaf3de;
  color: #3b6d11;
}
.quiz-count {
  font-size: 12px;
  color: #888;
}
.quiz-body {
  padding: 24px 20px 16px;
  min-height: 200px;
}
.quiz-label {
  font-size: 11px;
  color: #aaa;
  letter-spacing: 0.08em;
  margin-bottom: 12px;
}
.quiz-question {
  font-size: 16px;
  color: #1a1a1a;
  line-height: 1.7;
  min-height: 60px;
  font-weight: 500;
}
.cursor {
  display: inline-block;
  width: 2px;
  height: 18px;
  background: #1a1a1a;
  margin-left: 2px;
  vertical-align: middle;
  animation: blink 0.7s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
.options {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.option {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 14px;
  border: 1px solid #e5e5e5;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  color: #333;
  line-height: 1.5;
  transition: background 0.15s;
  text-align: left;
  background: #fff;
  width: 100%;
}
.option:hover { background: #f5f5f5; }
.option.correct { background: #eaf3de; border-color: #639922; color: #3b6d11; }
.option.wrong { background: #fce8e8; border-color: #e24b4a; color: #a32d2d; }
.option-num {
  font-weight: 600;
  font-size: 13px;
  flex-shrink: 0;
  margin-top: 1px;
}
.answer-box {
  display: none;
  margin-top: 16px;
  padding: 12px 16px;
  background: #f0f7e8;
  border-left: 3px solid #639922;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: #3b6d11;
  line-height: 1.6;
}
.quiz-footer {
  padding: 12px 20px;
  border-top: 1px solid #e5e5e5;
  display: flex;
  gap: 8px;
}
.btn {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid #e5e5e5;
  background: #fff;
  color: #333;
  transition: background 0.15s;
}
.btn:hover { background: #f5f5f5; }
.btn-answer {
  background: #f8f0ff;
  color: #7c3aed;
  border-color: #ddd0ff;
}
.btn-answer:hover { background: #ede9fe; }
.btn-next {
  background: #1a1a1a;
  color: #fff;
  border-color: #1a1a1a;
}
.btn-next:hover { background: #333; }
.btn-pass {
  background: #fff8e6;
  color: #b45309;
  border-color: #fde68a;
}
.btn-pass:hover { background: #fef3c7; }
.progress-bar {
  height: 3px;
  background: #f0f0f0;
}
.progress-fill {
  height: 100%;
  background: #639922;
  transition: width 0.4s ease;
}
.result-box {
  padding: 40px 20px;
  text-align: center;
}
.result-emoji { font-size: 48px; margin-bottom: 12px; }
.result-title { font-size: 22px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; }
.result-sub { font-size: 14px; color: #888; margin-bottom: 24px; }
.result-stats {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 24px;
}
.stat-card {
  background: #f8f9fa;
  border-radius: 12px;
  padding: 14px 20px;
  text-align: center;
}
.stat-num { font-size: 24px; font-weight: 700; color: #1a1a1a; }
.stat-label { font-size: 12px; color: #888; margin-top: 2px; }
.btn-restart {
  padding: 12px 32px;
  background: #1a1a1a;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
}
.btn-restart:hover { background: #333; }
</style>
</head>
<body>
<div class="quiz-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
  <div id="main"></div>
</div>

<script>
const today = new Date();
const stage1End = new Date('2026-06-15');
const stage2End = new Date('2026-07-19');
const stage3End = new Date('2026-08-21');

let currentStage, stageLabel, stageColor;
if (today <= stage1End) {
  currentStage = 1; stageLabel = '1단계 기초 다지기'; stageColor = '#eaf3de';
} else if (today <= stage2End) {
  currentStage = 2; stageLabel = '2단계 SQL 심화'; stageColor = '#e6f1fb';
} else {
  currentStage = 3; stageLabel = '3단계 최종 마무리'; stageColor = '#faeeda';
}

const questions = {
  1: [
    { q: "엔터티(Entity)란 무엇인가?", opts: ["데이터베이스의 테이블을 의미한다", "현실 세계에서 독립적으로 존재하는 사람, 사물, 개념 등의 집합이다", "속성들의 묶음이다", "두 엔터티 간의 연결 관계이다"], ans: 1, exp: "엔터티는 현실 세계에서 독립적으로 존재하며 관리해야 할 정보의 집합입니다." },
    { q: "다음 중 엔터티가 되기 위한 조건이 아닌 것은?", opts: ["업무에서 사용되는 정보이어야 한다", "두 개 이상의 인스턴스가 존재해야 한다", "반드시 다른 엔터티와 관계를 가져야 한다", "유일한 식별자에 의해 식별되어야 한다"], ans: 2, exp: "엔터티가 반드시 다른 엔터티와 관계를 가져야 하는 것은 아닙니다." },
    { q: "속성(Attribute)에 대한 설명으로 올바른 것은?", opts: ["속성은 여러 개의 값을 동시에 가질 수 있다", "속성은 엔터티를 설명하는 최소 단위이다", "속성은 반드시 기본키가 되어야 한다", "속성은 다른 속성을 포함할 수 있다"], ans: 1, exp: "속성은 엔터티의 특성을 설명하는 가장 작은 단위입니다." },
    { q: "기본키(Primary Key)의 특징으로 올바른 것은?", opts: ["NULL 값을 허용한다", "중복된 값을 가질 수 있다", "유일하고 NULL이 허용되지 않는다", "하나의 테이블에 여러 개가 존재할 수 있다"], ans: 2, exp: "기본키는 유일성(중복 불가)과 최소성을 만족하며 NULL 값을 허용하지 않습니다." },
    { q: "관계(Relationship)에 대한 설명으로 올바른 것은?", opts: ["두 엔터티 간의 연관성을 나타낸다", "반드시 1:1 관계만 존재한다", "항상 필수 참여가 되어야 한다", "속성을 가질 수 없다"], ans: 0, exp: "관계는 두 엔터티 간의 업무적 연관성을 나타냅니다." },
    { q: "주식별자의 특징으로 올바르지 않은 것은?", opts: ["유일성: 각 인스턴스를 유일하게 구분한다", "최소성: 주식별자 구성 속성의 수를 최소화한다", "불변성: 주식별자의 값은 변하지 않아야 한다", "다중성: 여러 개의 값을 가질 수 있다"], ans: 3, exp: "주식별자는 유일성, 최소성, 불변성, 존재성을 만족해야 합니다. 다중성은 해당되지 않습니다." },
    { q: "두 개 이상의 엔터티로부터 발생하는 엔터티는?", opts: ["기본 엔터티", "중심 엔터티", "행위 엔터티", "개념 엔터티"], ans: 2, exp: "행위 엔터티는 두 개 이상의 부모 엔터티로부터 발생하는 엔터티입니다." },
    { q: "외래키(Foreign Key)에 대한 설명으로 올바른 것은?", opts: ["자신이 속한 테이블의 기본키와 동일해야 한다", "다른 테이블의 기본키를 참조하는 키이다", "NULL 값을 가질 수 없다", "반드시 유일한 값을 가져야 한다"], ans: 1, exp: "외래키는 다른 테이블의 기본키를 참조하며, NULL 값을 허용할 수 있습니다." },
    { q: "NULL에 대한 설명으로 올바르지 않은 것은?", opts: ["NULL은 0과 같다", "NULL은 아직 알 수 없는 값이다", "NULL과의 산술연산 결과는 NULL이다", "NULL 비교는 IS NULL을 사용해야 한다"], ans: 0, exp: "NULL은 0이나 빈 문자열과 다릅니다. 아직 알 수 없거나 적용 불가한 값을 나타냅니다." },
    { q: "데이터 모델링의 3단계 순서로 올바른 것은?", opts: ["물리적 → 논리적 → 개념적", "개념적 → 물리적 → 논리적", "개념적 → 논리적 → 물리적", "논리적 → 개념적 → 물리적"], ans: 2, exp: "데이터 모델링은 개념적 → 논리적 → 물리적 순서로 진행됩니다." },
    { q: "SELECT문의 기본 구조로 올바른 것은?", opts: ["FROM → WHERE → SELECT", "SELECT → FROM → WHERE", "WHERE → SELECT → FROM", "SELECT → WHERE → FROM"], ans: 1, exp: "SELECT문의 문법 순서는 SELECT → FROM → WHERE입니다." },
    { q: "WHERE절에서 NULL 값을 조회하는 올바른 SQL은?", opts: ["WHERE 컬럼 = NULL", "WHERE 컬럼 == NULL", "WHERE 컬럼 IS NULL", "WHERE 컬럼 = ''"], ans: 2, exp: "NULL 비교는 = 연산자가 아닌 IS NULL을 사용해야 합니다." },
    { q: "ORDER BY절의 기본 정렬 순서는?", opts: ["내림차순(DESC)", "오름차순(ASC)", "삽입 순서", "랜덤"], ans: 1, exp: "ORDER BY의 기본 정렬 순서는 오름차순(ASC)입니다." },
    { q: "SELECT DISTINCT에 대한 설명으로 올바른 것은?", opts: ["특정 컬럼만 선택한다", "중복된 행을 제거하고 조회한다", "NULL 값을 제거한다", "결과를 오름차순으로 정렬한다"], ans: 1, exp: "DISTINCT는 중복된 행을 제거하여 고유한 값만 반환합니다." },
    { q: "BETWEEN 연산자에 대한 설명으로 올바른 것은?", opts: ["범위의 양 끝값을 포함하지 않는다", "범위의 양 끝값을 포함한다", "숫자에만 사용 가능하다", "날짜에는 사용할 수 없다"], ans: 1, exp: "BETWEEN A AND B는 A 이상 B 이하로 양 끝값을 포함합니다." },
    { q: "LIKE 연산자에서 임의의 한 문자를 나타내는 와일드카드는?", opts: ["%", "*", "_", "?"], ans: 2, exp: "_ 는 임의의 한 문자를, % 는 임의의 0개 이상의 문자를 나타냅니다." },
    { q: "COUNT(*) 함수에 대한 설명으로 올바른 것은?", opts: ["NULL 값을 제외한 행의 수를 반환한다", "NULL 값을 포함한 전체 행의 수를 반환한다", "고유한 값의 수를 반환한다", "합계를 반환한다"], ans: 1, exp: "COUNT(*)는 NULL을 포함한 전체 행의 수를 반환합니다. COUNT(컬럼명)은 NULL 제외." },
    { q: "다음 중 집계 함수가 아닌 것은?", opts: ["COUNT", "SUM", "AVG", "DECODE"], ans: 3, exp: "DECODE는 Oracle의 조건 함수입니다. COUNT, SUM, AVG, MAX, MIN이 집계 함수입니다." },
    { q: "WHERE절에서 사용할 수 없는 것은?", opts: ["집계 함수", "BETWEEN", "LIKE", "IN"], ans: 0, exp: "집계 함수는 WHERE절에 사용할 수 없으며, 집계 후 조건은 HAVING절을 사용합니다." },
    { q: "SQL 실행 순서로 올바른 것은?", opts: ["SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY", "FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY", "FROM → SELECT → WHERE → GROUP BY → HAVING → ORDER BY", "SELECT → WHERE → FROM → GROUP BY → HAVING → ORDER BY"], ans: 1, exp: "SQL 실행 순서: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY" },
    { q: "DDL(Data Definition Language)에 해당하는 명령어는?", opts: ["SELECT", "INSERT", "CREATE", "UPDATE"], ans: 2, exp: "DDL은 CREATE, ALTER, DROP, TRUNCATE입니다. INSERT, UPDATE, DELETE는 DML입니다." },
    { q: "TRUNCATE와 DELETE의 차이로 올바른 것은?", opts: ["TRUNCATE는 롤백이 가능하다", "DELETE는 전체 삭제 시 롤백이 불가능하다", "TRUNCATE는 DDL로 롤백이 불가능하다", "DELETE는 DDL에 해당한다"], ans: 2, exp: "TRUNCATE는 DDL이므로 롤백이 불가능하고, DELETE는 DML이므로 롤백이 가능합니다." },
    { q: "COMMIT에 대한 설명으로 올바른 것은?", opts: ["트랜잭션의 변경사항을 취소한다", "트랜잭션의 변경사항을 영구적으로 저장한다", "특정 시점으로 되돌아간다", "테이블을 삭제한다"], ans: 1, exp: "COMMIT은 트랜잭션의 변경사항을 데이터베이스에 영구적으로 반영합니다." },
    { q: "ROLLBACK에 대한 설명으로 올바른 것은?", opts: ["트랜잭션의 변경사항을 영구적으로 저장한다", "트랜잭션의 변경사항을 취소하고 이전 상태로 되돌린다", "새로운 트랜잭션을 시작한다", "데이터베이스를 삭제한다"], ans: 1, exp: "ROLLBACK은 트랜잭션의 변경사항을 취소하고 이전 상태로 되돌립니다." },
    { q: "NVL 함수에 대한 설명으로 올바른 것은?", opts: ["NULL 값을 다른 값으로 대체한다", "NULL 값을 제거한다", "NULL 값만 0으로 변환한다", "NULL 여부만 확인한다"], ans: 0, exp: "NVL(컬럼, 대체값)은 NULL일 때 지정한 대체값을 반환합니다." },
    { q: "카디널리티(Cardinality)란 무엇인가?", opts: ["엔터티 간의 관계 유형(1:1, 1:N, M:N)을 의미한다", "속성의 개수를 의미한다", "인스턴스의 총 개수를 의미한다", "테이블의 컬럼 수를 의미한다"], ans: 0, exp: "카디널리티는 두 엔터티 간의 관계에서 각 인스턴스가 몇 개의 상대방 인스턴스와 관계를 맺는지 나타냅니다." },
    { q: "1:N 관계에 대한 설명으로 올바른 것은?", opts: ["하나의 인스턴스가 다른 엔터티의 하나의 인스턴스와만 관계를 맺는다", "하나의 인스턴스가 다른 엔터티의 여러 인스턴스와 관계를 맺는다", "여러 인스턴스가 다른 엔터티의 여러 인스턴스와 관계를 맺는다", "관계가 존재하지 않는다"], ans: 1, exp: "1:N 관계는 한 엔터티의 하나의 인스턴스가 다른 엔터티의 여러 인스턴스와 관계를 맺는 것입니다." },
    { q: "ERD(Entity Relationship Diagram)에 대한 설명으로 올바른 것은?", opts: ["프로세스 흐름을 나타내는 다이어그램이다", "엔터티 간의 관계를 시각적으로 표현한 것이다", "SQL 문장을 도식화한 것이다", "테이블의 인덱스를 나타낸 것이다"], ans: 1, exp: "ERD는 엔터티, 속성, 관계를 시각적으로 표현한 데이터 모델링 도구입니다." },
    { q: "GRANT에 대한 설명으로 올바른 것은?", opts: ["권한을 취소한다", "권한을 부여한다", "데이터를 삽입한다", "트랜잭션을 커밋한다"], ans: 1, exp: "GRANT는 사용자에게 권한을 부여하는 DCL 명령어입니다. REVOKE는 권한을 취소합니다." },
    { q: "ALTER TABLE에 대한 설명으로 올바른 것은?", opts: ["테이블을 삭제한다", "테이블의 구조를 변경한다", "테이블의 데이터를 변경한다", "테이블을 새로 생성한다"], ans: 1, exp: "ALTER TABLE은 기존 테이블의 구조(컬럼 추가, 수정, 삭제)를 변경하는 DDL 명령어입니다." },
    { q: "트랜잭션의 ACID 중 일관성(Consistency)에 대한 설명으로 올바른 것은?", opts: ["트랜잭션은 완전히 실행되거나 전혀 실행되지 않아야 한다", "트랜잭션 실행 전후 데이터베이스는 항상 일관된 상태를 유지해야 한다", "동시에 실행되는 트랜잭션은 서로 영향을 주지 않아야 한다", "완료된 트랜잭션의 결과는 영구적으로 저장되어야 한다"], ans: 1, exp: "일관성(Consistency): 트랜잭션 전후 데이터베이스는 항상 일관된 상태여야 합니다. 원자성(A), 일관성(C), 고립성(I), 지속성(D)" },
    { q: "문자열 연결 연산자로 올바른 것은? (Oracle 기준)", opts: ["+", "&", "||", "CONCAT만 가능"], ans: 2, exp: "Oracle에서 문자열 연결은 || 연산자를 사용합니다. SQL Server는 +를 사용합니다." },
    { q: "컬럼에 별칭(Alias)을 주는 방법으로 올바른 것은?", opts: ["SELECT 컬럼명 AS 별칭", "SELECT 컬럼명 = 별칭", "SELECT 별칭 FROM 컬럼명", "SELECT 컬럼명 TO 별칭"], ans: 0, exp: "컬럼 별칭은 AS 키워드를 사용합니다. AS는 생략 가능합니다." },
    { q: "IN 연산자에 대한 설명으로 올바른 것은?", opts: ["범위 조건을 지정한다", "여러 값 중 하나와 일치하는 행을 조회한다", "패턴 매칭에 사용된다", "NULL 값 조회에 사용된다"], ans: 1, exp: "IN은 지정한 값 목록 중 하나와 일치하는 행을 조회합니다. WHERE 컬럼 IN (값1, 값2, ...)" },
    { q: "DML(Data Manipulation Language)에 해당하지 않는 것은?", opts: ["INSERT", "UPDATE", "DELETE", "DROP"], ans: 3, exp: "DROP은 DDL입니다. DML은 INSERT, UPDATE, DELETE, SELECT입니다." },
    { q: "CASE문에 대한 설명으로 올바른 것은?", opts: ["WHERE절에서만 사용 가능하다", "조건에 따라 다른 값을 반환한다", "집계 함수 안에서만 사용 가능하다", "ORDER BY절에서 사용할 수 없다"], ans: 1, exp: "CASE문은 SELECT, WHERE, ORDER BY 등 다양한 위치에서 조건에 따라 다른 값을 반환합니다." },
    { q: "속성의 종류가 아닌 것은?", opts: ["기본 속성", "설계 속성", "파생 속성", "관계 속성"], ans: 3, exp: "속성의 종류는 기본 속성, 설계 속성, 파생 속성입니다." },
    { q: "다음 SQL에서 오류가 발생하는 이유는?\nSELECT 학과, COUNT(*) FROM 학생 WHERE COUNT(*) > 5 GROUP BY 학과;", opts: ["WHERE절에 집계 함수를 사용할 수 없다", "GROUP BY절이 잘못되었다", "COUNT(*)를 사용할 수 없다", "오류가 없다"], ans: 0, exp: "집계 함수는 WHERE절에 사용할 수 없습니다. HAVING절을 사용해야 합니다." },
    { q: "식별자의 종류가 아닌 것은?", opts: ["주식별자", "대체식별자", "외부식별자", "참조식별자"], ans: 3, exp: "식별자의 종류: 주식별자, 대체식별자, 외부식별자(FK), 복합식별자 등입니다. 참조식별자는 없습니다." },

  2: [
    { q: "INNER JOIN에 대한 설명으로 올바른 것은?", opts: ["왼쪽 테이블의 모든 행을 반환한다", "두 테이블에서 조인 조건을 만족하는 행만 반환한다", "오른쪽 테이블의 모든 행을 반환한다", "두 테이블의 모든 행을 반환한다"], ans: 1, exp: "INNER JOIN은 두 테이블에서 조인 조건을 만족하는 행만 반환합니다." },
    { q: "LEFT OUTER JOIN에 대한 설명으로 올바른 것은?", opts: ["오른쪽 테이블 기준 모든 행을 반환한다", "왼쪽 테이블의 모든 행을 반환하고, 오른쪽에 매칭되지 않으면 NULL을 반환한다", "두 테이블의 교집합만 반환한다", "두 테이블의 합집합을 반환한다"], ans: 1, exp: "LEFT OUTER JOIN은 왼쪽 테이블의 모든 행을 반환하며 매칭되지 않는 오른쪽 컬럼은 NULL입니다." },
    { q: "HAVING절에 대한 설명으로 올바른 것은?", opts: ["그룹화 전 조건을 필터링한다", "그룹화 후 조건을 필터링한다", "WHERE절과 동일한 역할이다", "ORDER BY절 뒤에 위치한다"], ans: 1, exp: "HAVING은 GROUP BY로 그룹화된 결과에 조건을 적용합니다. WHERE는 그룹화 전 조건입니다." },
    { q: "정규화(Normalization)의 목적으로 올바른 것은?", opts: ["데이터 중복을 증가시킨다", "데이터 무결성을 유지하고 중복을 제거한다", "조회 성능을 향상시킨다", "테이블 수를 줄인다"], ans: 1, exp: "정규화는 데이터 중복을 제거하고 데이터 무결성을 유지하기 위해 수행합니다." },
    { q: "제1정규형(1NF)의 조건으로 올바른 것은?", opts: ["모든 속성이 원자값(하나의 값)만 가져야 한다", "부분 함수 종속을 제거해야 한다", "이행 함수 종속을 제거해야 한다", "다치 종속을 제거해야 한다"], ans: 0, exp: "1NF: 모든 속성이 원자값을 가져야 합니다 (반복 그룹 제거)." },
    { q: "제2정규형(2NF)이 되기 위한 조건으로 올바른 것은?", opts: ["원자값을 가져야 한다", "부분 함수 종속을 제거해야 한다", "이행 함수 종속을 제거해야 한다", "조인 종속을 제거해야 한다"], ans: 1, exp: "2NF: 1NF를 만족하면서 기본키의 일부에만 종속되는 부분 함수 종속을 제거해야 합니다." },
    { q: "제3정규형(3NF)이 되기 위한 조건으로 올바른 것은?", opts: ["원자값을 가져야 한다", "부분 함수 종속을 제거해야 한다", "이행 함수 종속을 제거해야 한다", "다치 종속을 제거해야 한다"], ans: 2, exp: "3NF: 2NF를 만족하면서 기본키가 아닌 속성이 다른 비기본키 속성에 종속되는 이행 함수 종속을 제거해야 합니다." },
    { q: "반정규화(Denormalization)에 대한 설명으로 올바른 것은?", opts: ["데이터 중복을 줄이기 위해 수행한다", "조회 성능 향상을 위해 의도적으로 중복을 허용한다", "반드시 수행해야 한다", "데이터 무결성을 향상시킨다"], ans: 1, exp: "반정규화는 성능 향상을 위해 의도적으로 중복을 허용하는 기법입니다. 무결성 저하의 위험이 있습니다." },
    { q: "UNION과 UNION ALL의 차이로 올바른 것은?", opts: ["UNION은 중복을 포함하고, UNION ALL은 중복을 제거한다", "UNION은 중복을 제거하고, UNION ALL은 중복을 포함한다", "UNION ALL은 사용할 수 없다", "둘 다 동일한 결과를 반환한다"], ans: 1, exp: "UNION은 중복 제거(느림), UNION ALL은 중복 포함(빠름)입니다." },
    { q: "스칼라 서브쿼리(Scalar Subquery)에 대한 설명으로 올바른 것은?", opts: ["FROM절에 위치하는 서브쿼리이다", "SELECT절에 위치하며 반드시 단일 행, 단일 컬럼을 반환해야 한다", "WHERE절에서만 사용 가능하다", "여러 행을 반환할 수 있다"], ans: 1, exp: "스칼라 서브쿼리는 SELECT절에 사용되며 반드시 1행 1열의 결과를 반환해야 합니다." },
    { q: "인라인 뷰(Inline View)에 대한 설명으로 올바른 것은?", opts: ["CREATE VIEW로 생성한 뷰이다", "FROM절에 위치하는 서브쿼리이다", "WHERE절에 위치하는 서브쿼리이다", "SELECT절에 위치하는 서브쿼리이다"], ans: 1, exp: "인라인 뷰는 FROM절에 위치하는 서브쿼리입니다." },
    { q: "SELF JOIN에 대한 설명으로 올바른 것은?", opts: ["두 개의 서로 다른 테이블을 조인한다", "같은 테이블을 두 번 사용하여 조인한다", "NULL 값을 포함하는 행을 조인한다", "집계 함수와 함께만 사용되는 조인이다"], ans: 1, exp: "SELF JOIN은 동일한 테이블을 별칭(Alias)을 다르게 하여 자기 자신과 조인하는 기법입니다." },
    { q: "CROSS JOIN(카테시안 곱)의 결과로 올바른 것은?", opts: ["두 테이블의 교집합", "두 테이블 행의 모든 조합 (m × n)", "두 테이블의 합집합", "조인 조건을 만족하는 행"], ans: 1, exp: "CROSS JOIN은 두 테이블의 모든 행을 조합합니다. A 테이블 3행, B 테이블 4행이면 12행이 반환됩니다." },
    { q: "EXISTS에 대한 설명으로 올바른 것은?", opts: ["집합의 원소 개수를 반환한다", "서브쿼리의 결과가 존재하는지 여부를 확인한다", "특정 값이 집합에 포함되는지 확인한다", "NULL 값 여부를 확인한다"], ans: 1, exp: "EXISTS는 서브쿼리의 결과가 하나라도 존재하면 TRUE, 없으면 FALSE를 반환합니다." },
    { q: "INTERSECT에 대한 설명으로 올바른 것은?", opts: ["두 쿼리 결과의 합집합을 반환한다", "두 쿼리 결과의 교집합을 반환한다", "두 쿼리 결과의 차집합을 반환한다", "두 쿼리 결과를 연결한다"], ans: 1, exp: "INTERSECT는 두 SELECT 결과의 교집합을 반환합니다." },
    { q: "MINUS(또는 EXCEPT)에 대한 설명으로 올바른 것은?", opts: ["두 쿼리 결과의 합집합을 반환한다", "두 쿼리 결과의 교집합을 반환한다", "첫 번째 쿼리 결과에서 두 번째 쿼리 결과를 뺀 차집합을 반환한다", "두 쿼리 결과를 단순 연결한다"], ans: 2, exp: "MINUS(Oracle) / EXCEPT(SQL Server)는 첫 번째 쿼리 결과에서 두 번째 쿼리 결과를 제외한 차집합입니다." },
    { q: "COALESCE 함수에 대한 설명으로 올바른 것은?", opts: ["두 값을 비교하여 큰 값을 반환한다", "여러 인수 중 NULL이 아닌 첫 번째 값을 반환한다", "NULL 값을 무조건 0으로 변환한다", "문자열을 합친다"], ans: 1, exp: "COALESCE(val1, val2, ...)는 인수 중 NULL이 아닌 첫 번째 값을 반환합니다." },
    { q: "윈도우 함수(Window Function)에 대한 설명으로 올바른 것은?", opts: ["GROUP BY와 동일한 기능이다", "행 간의 관계를 정의하여 집계 작업을 수행하며 결과 행의 수를 줄이지 않는다", "WHERE절에서만 사용 가능하다", "반드시 PARTITION BY를 사용해야 한다"], ans: 1, exp: "윈도우 함수는 GROUP BY와 달리 행의 수를 유지하면서 집계, 순위, 분석 작업을 수행합니다." },
    { q: "RANK()와 DENSE_RANK()의 차이로 올바른 것은?", opts: ["차이가 없다", "RANK()는 동순위 다음 순위를 건너뛰고, DENSE_RANK()는 건너뛰지 않는다", "DENSE_RANK()는 동순위 다음 순위를 건너뛰고, RANK()는 건너뛰지 않는다", "RANK()는 NULL을 무시한다"], ans: 1, exp: "RANK(): 1,1,3 (2 건너뜀) / DENSE_RANK(): 1,1,2 (건너뛰지 않음) / ROW_NUMBER(): 1,2,3 (고유번호)" },
    { q: "ROW_NUMBER() 함수에 대한 설명으로 올바른 것은?", opts: ["동순위에 같은 번호를 부여한다", "파티션 내에서 각 행에 고유한 순번을 부여한다", "집계 함수로 사용된다", "GROUP BY와 함께 사용해야 한다"], ans: 1, exp: "ROW_NUMBER()는 동순위 여부와 관계없이 각 행에 고유한 순번을 부여합니다." },
    { q: "VIEW에 대한 설명으로 올바른 것은?", opts: ["데이터를 물리적으로 저장한다", "하나 이상의 테이블에서 유도된 가상 테이블이다", "인덱스를 자동으로 생성한다", "항상 업데이트가 가능하다"], ans: 1, exp: "뷰(View)는 실제 데이터를 저장하지 않는 가상 테이블입니다." },
    { q: "INDEX에 대한 설명으로 올바른 것은?", opts: ["데이터 조회 속도를 느리게 한다", "데이터 조회 속도를 향상시키지만 INSERT/UPDATE/DELETE 성능은 저하될 수 있다", "반드시 기본키에만 생성할 수 있다", "테이블당 하나만 생성할 수 있다"], ans: 1, exp: "인덱스는 조회 성능을 향상시키지만, 데이터 변경 시 인덱스도 갱신해야 하므로 DML 성능이 저하될 수 있습니다." },
    { q: "DECODE 함수에 대한 설명으로 올바른 것은? (Oracle 기준)", opts: ["문자열을 디코딩한다", "IF-THEN-ELSE 로직을 구현하는 Oracle 함수이다", "날짜를 변환한다", "숫자를 반올림한다"], ans: 1, exp: "DECODE(조건, 값1, 결과1, 값2, 결과2, 기본값)은 Oracle 전용 조건 함수입니다." },
    { q: "GROUPING SETS에 대한 설명으로 올바른 것은?", opts: ["여러 GROUP BY 조건을 한 번에 처리한다", "HAVING절의 대체 구문이다", "집합 연산에 사용된다", "윈도우 함수의 일종이다"], ans: 0, exp: "GROUPING SETS는 여러 그룹화 조건을 하나의 쿼리로 처리할 수 있습니다." },

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

    });
  });
  selected = false;
}

function typeText(text, id, cb) {
  const el = document.getElementById(id);
  el.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  let i = 0;
  const speed = Math.max(20, Math.min(40, 1200 / text.length));
  const timer = setInterval(() => {
    if (i < text.length) {
      el.insertBefore(document.createTextNode(text[i] === '\n' ? '' : text[i]), cursor);
      if (text[i] === '\n') el.insertBefore(document.createElement('br'), cursor);
      i++;
    } else {
      clearInterval(timer);
      cursor.remove();
      if (cb) cb();
    }
  }, speed);
}

function selectOpt(i) {
  if (selected) return;
  selected = true;
  answered++;
  const q = shuffled[idx];
  const opts = document.querySelectorAll('.option');
  opts.forEach((btn, j) => {
    if (j === q.ans) btn.classList.add('correct');
    else if (j === i) btn.classList.add('wrong');
    btn.onclick = null;
  });
  if (i === q.ans) correct++;
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('answerBox').textContent = '📌 해설: ' + q.exp;
  document.getElementById('nextBtn').style.display = 'flex';
}

function showAnswer() {
  if (selected) return;
  selected = true;
  answered++;
  const q = shuffled[idx];
  const opts = document.querySelectorAll('.option');
  opts.forEach((btn, j) => {
    if (j === q.ans) btn.classList.add('correct');
    btn.onclick = null;
  });
  document.getElementById('answerBox').style.display = 'block';
  document.getElementById('answerBox').textContent = '📌 해설: ' + q.exp;
  document.getElementById('nextBtn').style.display = 'flex';
}

function passQ() {
  idx++; render();
}

function nextQ() {
  idx++; render();
}

function showResult() {
  document.getElementById('progress').style.width = '100%';
  const rate = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  let emoji, msg;
  if (rate >= 80) { emoji = '🏆'; msg = '완벽해요! 합격이 눈앞에!'; }
  else if (rate >= 60) { emoji = '👍'; msg = '잘하고 있어요! 조금 더 화이팅!'; }
  else { emoji = '📚'; msg = '틀린 문제 복습하고 다시 도전해요!'; }

  document.getElementById('main').innerHTML = `
    <div class="result-box">
      <div class="result-emoji">${emoji}</div>
      <div class="result-title">${msg}</div>
      <div class="result-sub">${stageLabel} 완료!</div>
      <div class="result-stats">
        <div class="stat-card"><div class="stat-num">${correct}</div><div class="stat-label">정답</div></div>
        <div class="stat-card"><div class="stat-num">${answered - correct}</div><div class="stat-label">오답</div></div>
        <div class="stat-card"><div class="stat-num">${total - answered}</div><div class="stat-label">패스</div></div>
        <div class="stat-card"><div class="stat-num">${rate}%</div><div class="stat-label">정답률</div></div>
      </div>
      <button class="btn-restart" onclick="location.reload()">다시 풀기 🔄</button>
    </div>
  `;
}

render();
</script>
</body>
</html>
